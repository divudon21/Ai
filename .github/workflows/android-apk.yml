name: Build APKs & Create Release

on:
  push:
    branches: [ arena/59d42030-ai ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          cat android/local.properties
      - run: yes | flutter doctor --android-licenses
      - run: flutter pub get
      - name: Install Gradle 8.5
        run: |
          curl -fsSL --retry 3 "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH
          gradle --version
      - name: Create release signing keystore + key.properties
        run: |
          keytool -genkeypair -v \
            -keystore android/upload-key.jks \
            -alias upload-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android
          printf 'storeFile=upload-key.jks\nstorePassword=android\nkeyAlias=upload-key\nkeyPassword=android\n' > android/key.properties
      - name: Build APK (debug first to isolate signing issues)
        run: |
          echo "=== Building debug APK ==="
          flutter build apk --debug --stacktrace 2>&1 | tee /tmp/debug_build.log
          echo "=== Debug build exit: ${PIPESTATUS[0]} ==="
      - name: Build APK (release)
        run: |
          echo "=== Building release APK ==="
          flutter build apk --release --stacktrace 2>&1 | tee /tmp/release_build.log
          echo "=== Release build exit: ${PIPESTATUS[0]} ==="
