name: Build APKs & Create Release

on:
  push:
    branches: [ arena/59d42030-ai ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'
      - run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          cat android/local.properties
      - run: yes | flutter doctor --android-licenses
      - run: flutter pub get
      - name: Install Gradle 8.5
        run: |
          curl -fsSL --retry 3 "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH
          gradle --version
      - name: Create release signing keystore + key.properties
        run: |
          keytool -genkeypair -v \
            -keystore android/upload-key.jks \
            -alias upload-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android
          printf 'storeFile=upload-key.jks\nstorePassword=android\nkeyAlias=upload-key\nkeyPassword=android\n' > android/key.properties
      - name: Build APK with Flutter 3.22.0
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Building APK ==="
          flutter build apk --release --verbose 2>&1 | tee /tmp/flutter_build.log
          echo "=== Flutter exit: ${PIPESTATUS[0]} ==="
          echo "=== Full Flutter output ==="
          cat /tmp/flutter_build.log
      - name: Search for APK everywhere
        run: |
          echo "=== Searching workspace for APKs ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APKs in workspace"
          echo "=== Searching /tmp for APKs ==="
          find /tmp -name "*.apk" -type f 2>/dev/null || echo "No APKs in /tmp"
          echo "=== Searching /home for APKs ==="
          find /home -name "*.apk" -type f 2>/dev/null || echo "No APKs in /home"
          echo "=== Listing build/app/outputs/flutter-apk/ ==="
          ls -laR build/app/outputs/flutter-apk/ 2>/dev/null || echo "Not found"
          echo "=== Listing build/app/outputs/apk/release/ ==="
          ls -laR build/app/outputs/apk/release/ 2>/dev/null || echo "Not found"
          echo "=== All files in build/ ==="
          find build -type f 2>/dev/null | head -30 || echo "No files in build/"
      - name: Copy APK if found
        run: |
          APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "FOUND_APK=$APK_PATH" >> $GITHUB_ENV
          echo "Found: $APK_PATH"
          cp "$APK_PATH" ./app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a
          path: app-release.apk
          if-no-files-found: error
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/arena/59d42030-ai'
        uses: softprops/action-gh-release@v2
        with:
          name: "AI Agent Downloader APK (arm64-v8a)"
          tag_name: "apk-${{ github.run_id }}"
          files: app-release.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
