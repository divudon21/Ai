name: Build APKs & Create Release

on:
  push:
    branches: [ arena/14c2d171-ai ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Write android/local.properties (flutter.sdk)
        run: |
          FLUTTER_DIR="$(dirname "$(dirname "$(which flutter)")")"
          echo "flutter.sdk=$FLUTTER_DIR" > android/local.properties
          cat android/local.properties

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install Gradle 8.5
        run: |
          curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.5-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp
          echo "GRADLE_HOME=/tmp/gradle-8.5" >> "$GITHUB_ENV"
          echo "/tmp/gradle-8.5/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Provide ./gradlew (delegate to installed Gradle)
        run: |
          cat > android/gradlew <<'SH'
#!/bin/sh
exec "${GRADLE_HOME:-/tmp/gradle-8.5}/bin/gradle" "$@"
SH
          chmod +x android/gradlew

      - name: Create release signing keystore + key.properties
        run: |
          keytool -genkeypair -v \
            -keystore android/app/upload-key.jks \
            -alias upload-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android
          cat > android/app/key.properties <<EOF
          storeFile=upload-key.jks
          storePassword=android
          keyAlias=upload-key
          keyPassword=android
          EOF

      - name: Build split APKs (armeabi-v7a + arm64-v8a)
        run: flutter build apk --split-per-abi --release

      - name: Build universal (fat) APK
        run: flutter build apk --release

      - name: List produced APKs
        run: |
          echo "=== APKs in build/app/outputs/flutter-apk/ ==="
          ls -la build/app/outputs/flutter-apk/

      - name: Create GitHub Release and upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "AI Agent Downloader - v${{ github.run_number }}"
          body: |
            AI Agent Downloader - APK Release

            Built from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            APKs included:
            - `app-arm64-v8a-release.apk`  (64-bit ARM / arm64-v8a)
            - `app-armeabi-v7a-release.apk` (32-bit ARM / arm7rb / armeabi-v7a)
            - `app-release.apk`              (universal / fat APK)

            Install any one on your Android device (enable "Install unknown apps" for your browser/file manager).

            Server URL is configurable in the app Settings — nothing is hardcoded.
        files: |
          build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
