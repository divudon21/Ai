name: Build APKs & Create Release

on:
  push:
    branches: [ arena/59d42030-ai ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          cat android/local.properties
      - name: Diagnostics - Flutter version
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Java version ==="
          java -version
          echo "=== Flutter doctor ==="
          flutter doctor -v
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses
      - name: Diagnostics - After licenses
        run: |
          echo "=== Licenses done, starting pub get ==="
          date
      - name: Flutter pub get
        run: |
          echo "=== Starting flutter pub get ==="
          date
          flutter pub get --verbose
          echo "=== Pub get exit code: $? ==="
          date
      - name: Install Gradle 8.5
        run: |
          echo "=== Installing Gradle ==="
          curl -fsSL --retry 3 "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH
          gradle --version
      - name: Create release signing keystore + key.properties
        run: |
          echo "=== Creating keystore ==="
          keytool -genkeypair -v \
            -keystore android/upload-key.jks \
            -alias upload-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android
          printf 'storeFile=upload-key.jks\nstorePassword=android\nkeyAlias=upload-key\nkeyPassword=android\n' > android/key.properties
          cat android/key.properties
      - name: Build APK
        run: |
          echo "=== Starting flutter build apk ==="
          date
          flutter clean
          flutter build apk --release --verbose
          echo "=== Build exit code: $? ==="
          date
