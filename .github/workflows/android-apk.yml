name: Build APKs & Create Release

on:
  push:
    branches: [ arena/59d42030-ai ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'
      - run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          cat android/local.properties
      - run: yes | flutter doctor --android-licenses
      - run: flutter pub get
      - name: Install Gradle 8.0
        run: |
          curl -fsSL --retry 3 "https://services.gradle.org/distributions/gradle-8.0-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.0/bin" >> $GITHUB_PATH
          gradle --version
      - name: Create release signing keystore + key.properties
        run: |
          keytool -genkeypair -v \
            -keystore android/upload-key.jks \
            -alias upload-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android
          printf 'storeFile=upload-key.jks\nstorePassword=android\nkeyAlias=upload-key\nkeyPassword=android\n' > android/key.properties
      - run: flutter build apk
      - name: List produced APKs
        run: |
          echo "=== APKs in build/app/outputs/flutter-apk/ ==="
          ls -la build/app/outputs/flutter-apk/
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
