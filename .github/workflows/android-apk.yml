name: Build APKs & Create Release

on:
  push:
    branches: [ arena/59d42030-ai ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          FLUTTER_DIR="$(dirname "$(dirname "$(which flutter)")")"
          echo "flutter.sdk=$FLUTTER_DIR" > android/local.properties
      - run: yes | flutter doctor --android-licenses
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: List produced APKs
        run: |
          echo "=== APKs in build/app/outputs/flutter-apk/ ==="
          ls -la build/app/outputs/flutter-apk/
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
